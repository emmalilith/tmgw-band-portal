services:
  - type: web
    runtime: node
    name: tmgw-brass-band-portal
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    preDeployCommand: pnpm drizzle-kit migrate
    startCommand: pnpm start
    autoDeployTrigger: commit
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: DATABASE_SSL
        value: "true"
